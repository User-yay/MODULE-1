<!DOCTYPE html>
<html>
    <title>
        navbar
    </title>
    <style>
        body {
            margin: 0;
            font-family: arial;
        }
        .topnav {
            overflow: hidden;
            background-color:rgb(30, 255, 248);
        }
        .topnav a {
            float: left;
            color:rgba(20, 239, 71, 0.531);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .topnav a:hover {
            background-color:rgb(30, 255, 248);
            color: black;
        }
        .topnav a.active {
            background-color:black;
            color: rgb(30, 255, 248);
        }
    </style>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
