<!DOCTYPE html>
<html>
    <head>
        <title>Random Function</title>
    </head>
    <body>
        <script>
            let oddOrEven = function(num) {
                if (num % 2 === 0) {
                    document.write(number + " is even");
                } else {
                    document.write(num + " is odd");
                }
            }
            let number = prompt("Enter a number to check if it is odd or even:");
            oddOrEven(number);
        </script>
    </body>
</html>
