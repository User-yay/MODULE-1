<!DOCTYPE html>
<html>
    <head>
        <title>
            navbar
        </title>
        <style>
            body {
                margin: 0;
                font-family: arial;
            }
            .topnav {
                overflow: hidden;
                background-color:dodgerblue;
            }
            .topnav a {
                float: left;
                color:aquamarine
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px
            }
            .topnav a:hover {
                background-color:aqua
                color: black;
            }
            .topnav a.active {
                background-color:black;
                color: aqua;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">home</a>
            <a href="#">About_Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact_us</a>
        </div>
        <section>
            <img class="mySlides" src="goofy ah cat in war thunder.gif" alt="" width="100%" height="500px">
            <img class="mySlides" src="hi bru.gif" alt="" width="100%" height="500px">
            <img class="mySlides" src="ah.gif" alt="" width="100%" height="500px">
        </section>
        <script>
            var myIndex = 0;
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlides");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000);
            }
        </script>
    </body>
</html>
